name: Publish Docker image to GHCR

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # dev branch -> :dev (+ :dev-<sha> for traceability)
    # main branch -> :stable, :latest (+ :<sha>)
    - name: Compute image tags
      id: tags
      run: |
        if [ "${{ github.ref_name }}" = "main" ]; then
          {
            echo "tags<<EOF"
            echo "ghcr.io/${{ github.repository }}:stable"
            echo "ghcr.io/${{ github.repository }}:latest"
            echo "ghcr.io/${{ github.repository }}:${{ github.sha }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        else
          {
            echo "tags<<EOF"
            echo "ghcr.io/${{ github.repository }}:dev"
            echo "ghcr.io/${{ github.repository }}:dev-${{ github.sha }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: build_scripts/docker/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: |
          type=gha,scope=docker-build
          type=gha,scope=docker-build-arm64
        cache-to: type=gha,mode=max,scope=docker-ghcr
