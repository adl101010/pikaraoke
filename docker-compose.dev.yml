services:
  pikaraoke:
    image: ghcr.io/adl101010/pikaraoke:dev
    container_name: testkar-dev
    ports:
      - "8845:8845"
    volumes:
      - testkar_songs_dev:/app/pikaraoke-songs
      - testkar_config_dev:/home/pikaraoke/.pikaraoke
    command:
      - "-p"
      - "8845"
      - "--high-quality"
      - "--disable-bg-music"
      - "--disable-bg-video"
      - "--disable-score"
      - "--admin-password"
      - "${ADMIN_PASSWORD:-bacon}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8845/"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    restart: unless-stopped

volumes:
  testkar_songs_dev:
    driver: local
  testkar_config_dev:
    driver: local
