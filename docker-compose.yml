services:
  pikaraoke:
    image: ghcr.io/adl101010/pikaraoke:latest
    container_name: testkar
    ports:
      - "8844:8844"
    volumes:
      - testkar_songs:/app/pikaraoke-songs
      - testkar_config:/home/pikaraoke/.pikaraoke
    command:
      - "-p"
      - "8844"
      - "--high-quality"
      - "--disable-bg-music"
      - "--disable-bg-video"
      - "--disable-score"
      - "--admin-password"
      - "${ADMIN_PASSWORD:-bacon}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8844/"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    restart: unless-stopped

volumes:
  testkar_songs:
    driver: local
  testkar_config:
    driver: local
